<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traders Journey Tracker - 31 Days (7-Column Weekly Layout)</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #060919;
            --box-bg: #0c1538;
            --box-border: #3b50ad;
            --text-white: #ffffff;
            --text-purple: #7a6ce7;
            --text-blue: #5b75ed;
            --completed-green: #2ecc71;
            --missed-red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(122, 108, 231, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 85% 90%, rgba(59, 80, 173, 0.15) 0%, transparent 20%);
            color: var(--text-white);
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px; /* Increased max-width to accommodate 7 columns nicely */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Headers --- */
        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            position: relative;
        }

        .discord-icon {
            width: 50px;
            fill: #5865F2;
        }

        .title-main {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            flex-grow: 1;
        }

        .title-main .purple {
            color: var(--text-purple);
        }

        .challenge-title {
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .challenge-title .purple {
            color: var(--text-purple);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        /* --- Tracker Header --- */
        .tracker-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
        }

        .line {
            height: 2px;
            background-color: var(--box-border);
            flex-grow: 0.1;
            min-width: 50px;
        }

        .tracker-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .chart-icon {
            width: 30px;
            fill: var(--text-blue);
        }

        /* --- Grid Section --- */
        .grid-container {
            display: grid;
            /* Changed from repeat(5, 1fr) to repeat(7, 1fr) for the new layout */
            grid-template-columns: repeat(7, 1fr); 
            gap: 15px;
            width: 100%;
            margin-bottom: 30px;
        }

        .day-card {
            background-color: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 12px;
            aspect-ratio: 4 / 5; /* Retained taller look, adjusted by JS if needed */
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
        }

        .day-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(59, 80, 173, 0.4);
            border-color: #5b75ed;
        }

        .day-label {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* The status symbol container at the bottom right */
        .status-symbol {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* Status States */
        .day-card[data-state="completed"] .status-symbol {
            opacity: 1;
            background-color: transparent;
            border: 2px solid var(--completed-green);
            color: var(--completed-green);
        }

        .day-card[data-state="missed"] .status-symbol {
            opacity: 1;
            background-color: transparent;
            border: 2px solid var(--missed-red);
            color: var(--missed-red);
        }

        /* --- Footer Legend --- */
        .footer-legend {
            background-color: rgba(12, 21, 56, 0.6);
            border: 2px solid var(--box-border);
            border-radius: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 15px 25px;
            justify-content: space-between;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .footer-icon-wrapper {
            background-color: var(--box-bg);
            border: 2px solid var(--box-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-text {
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .footer-divider {
            width: 2px;
            height: 40px;
            background-color: var(--box-border);
            margin: 0 20px;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            font-size: 1.1rem;
        }

        .legend-box {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .legend-completed {
            border: 2px solid var(--completed-green);
            color: var(--completed-green);
        }

        .legend-missed {
            border: 2px solid var(--missed-red);
            color: var(--missed-red);
        }

        /* --- Responsive Design (Updated for 7-Column Layout) --- */

        /* Tablets and smaller desktops: Drop to 5 columns */
        @media (max-width: 1024px) {
            .title-main { font-size: 3rem; }
            .challenge-title { font-size: 2.1rem; }
            
            .grid-container {
                grid-template-columns: repeat(5, 1fr); 
            }
        }

        /* Large Phones / Small Tablets: Drop to 4 columns */
        @media (max-width: 768px) {
            .title-main { font-size: 2.5rem; }
            .challenge-title { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; }
            .tracker-title { font-size: 1.6rem; }
            
            .grid-container {
                grid-template-columns: repeat(4, 1fr);
            }
            
            .footer-legend { flex-direction: column; gap: 15px; text-align: center; }
            .footer-divider { display: none; }
        }

        /* Small Mobile: Drop to 3 columns to prevent squashing */
        @media (max-width: 500px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px; /* Smaller gaps */
            }
            .header-top { flex-direction: column; }
            .discord-icon { display: none; }
            .day-label { font-size: 0.9rem; }
            .day-card { border-radius: 8px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <div class="header-top">
                <!-- Discord SVG -->
                <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                </svg>
                
                <h1 class="title-main">TRADERS <span class="purple">JOURNEY MONTH</span></h1>
                
                <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                </svg>
            </div>
            
            <h2 class="challenge-title">THE BETTER TRADER<br><span class="purple">HABITS CHALLENGE</span></h2>
            <p class="subtitle">Build positive habits, remove distractions and start today.</p>
        </header>

        <div class="tracker-header">
            <div class="line"></div>
            <!-- Chart SVG -->
            <svg class="chart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/>
                <path d="M22 3.4l-7.3 7.3-3.8-3.9-6.4 5.8 1.4 1.5 5-4.5 3.8 3.9L23.4 4.8z"/>
            </svg>
            <h3 class="tracker-title">MY TRACKER</h3>
            <svg class="chart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/>
                <path d="M22 3.4l-7.3 7.3-3.8-3.9-6.4 5.8 1.4 1.5 5-4.5 3.8 3.9L23.4 4.8z"/>
            </svg>
            <div class="line"></div>
        </div>

        <!-- Grid dynamically populated by JS -->
        <div class="grid-container" id="trackerGrid"></div>

        <div class="footer-legend">
            <div class="footer-left">
                <div class="footer-icon-wrapper">
                    <svg class="chart-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/>
                        <path d="M22 3.4l-7.3 7.3-3.8-3.9-6.4 5.8 1.4 1.5 5-4.5 3.8 3.9L23.4 4.8z"/>
                    </svg>
                </div>
                <div class="footer-text">
                    Tick each box for every trading<br>day you keep your commitment.
                </div>
            </div>
            
            <div class="footer-divider"></div>

            <div class="footer-right">
                <div class="legend-item">
                    <div class="legend-box legend-completed">✓</div> = completed
                </div>
                <div class="legend-item">
                    <div class="legend-box legend-missed">✕</div> = missed
                </div>
            </div>
        </div>

    </div>

    <script>
        const trackerGrid = document.getElementById('trackerGrid');

        // Load saved data from localStorage, or start fresh if nothing is saved
        const savedData = JSON.parse(localStorage.getItem('traderChallengeData')) || {};

        // Generate the 31 Day grid (remains the same JS logic)
        for (let i = 1; i <= 31; i++) {
            // Create Card
            const card = document.createElement('div');
            card.classList.add('day-card');
            
            // Check if there's a saved state for this day, default to 'empty'
            const dayState = savedData[`day_${i}`] || 'empty';
            card.setAttribute('data-state', dayState); 

            // Create Label
            const label = document.createElement('div');
            label.classList.add('day-label');
            label.innerText = `Day ${i}`;

            // Create Symbol Box
            const symbol = document.createElement('div');
            symbol.classList.add('status-symbol');
            
            // Fill symbol based on the saved state on initial load
            if (dayState === 'completed') {
                symbol.innerHTML = '✓';
            } else if (dayState === 'missed') {
                symbol.innerHTML = '✕';
            }

            // Append elements
            card.appendChild(label);
            card.appendChild(symbol);
            trackerGrid.appendChild(card);

            // Add Click Interactivity
            card.addEventListener('click', function() {
                const currentState = this.getAttribute('data-state');
                const symbolElement = this.querySelector('.status-symbol');
                let newState = 'empty';

                if (currentState === 'empty') {
                    // Mark as completed
                    newState = 'completed';
                    symbolElement.innerHTML = '✓';
                } else if (currentState === 'completed') {
                    // Mark as missed
                    newState = 'missed';
                    symbolElement.innerHTML = '✕';
                } else {
                    // Reset to empty
                    newState = 'empty';
                    symbolElement.innerHTML = '';
                }
                
                this.setAttribute('data-state', newState);

                // Save the new state back to localStorage
                savedData[`day_${i}`] = newState;
                localStorage.setItem('traderChallengeData', JSON.stringify(savedData));
            });
        }
    </script>
</body>
</html>
